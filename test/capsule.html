<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>dsh-client-ui-quote · capsule probe</title>
<style>
	body{margin:0;padding:16px;font:13px/1.6 system-ui,"Segoe UI",sans-serif;background:#fff;color:#1f2328}
	[data-conversation-content]{max-width:560px}
	.bubble{display:flex;flex-direction:column;gap:4px;padding:10px 12px;border-radius:14px;background:#f2f3f5}
	.sent{font-size:13px;line-height:1.6;white-space:pre-wrap}
	#probe-out{margin-top:16px;padding:10px;border-radius:8px;background:#0f1115;color:#d7dae0;
		font:12px/1.5 ui-monospace,Consolas,monospace;white-space:pre-wrap}
	#probe-out[data-status="pass"]{background:#0d2b1b;color:#a7f3c9}
	#probe-out[data-status="fail"]{background:#3a1418;color:#ffc9d0}
</style>
<script>
	// The DSH client module loader hands the bundle a `require` and keeps the
	// factory; the probe drives that factory exactly like the app does.
	window.__Loaded = null;
	window.__ModuleLoader__ = { load(loaded) { window.__Loaded = loaded; } };
</script>
<script src="../lib/client.js"></script>
<script>
	window.__probeErrors = [];
	window.addEventListener("error", (event) => window.__probeErrors.push(String(event.message)));
	window.addEventListener("unhandledrejection", (event) => window.__probeErrors.push("rejection: " + String(event.reason)));
	(async () => {
		const out = document.createElement("pre");
		out.id = "probe-out";
		document.body.append(out);

		const checks = [];
		const check = (name, ok, detail) => {
			checks.push({ name, ok: ok === true, detail: detail === undefined ? "" : String(detail) });
			return ok === true;
		};
		const wait = (ms) => new Promise((resolve) => setTimeout(resolve, ms));

		// ---- drive the bundle ------------------------------------------------
		const spec = window.__Loaded;
		check("bundle registers a module", spec !== null && spec !== undefined && spec.id === "dsh-client-ui-quote", spec && spec.id);
		const reactStub = { useRef: (value) => ({ current: value }), useEffect() {} };
		const exports_ = spec.factory((name) => {
			if (name === "react") return reactStub;
			throw new Error("unexpected require: " + name);
		});
		const sources = [];
		let effectDisposers = 0;
		exports_.apply({
			effect(fn) {
				const dispose = fn();
				if (typeof dispose === "function") effectDisposers += 1;
				return () => {};
			},
			get(name) {
				if (name === "inputTriggers") {
					return { registerSource(source) { sources.push(source); return () => {}; } };
				}
				return undefined;
			},
			locale: { register: () => () => {} },
			slots: { inject: (name, factory) => { factory(); return () => {}; }, register: () => () => {} }
		});
		check("apply installs an effect with a disposer", effectDisposers === 1, effectDisposers + " disposer(s)");
		check("capsule stylesheet is installed", document.getElementById("dsh-quote-capsule-style") !== null);

		const testing = exports_.__testing;
		const model = testing.quoteBlock("做法（推荐这条）\n我已经编好启动器");
		check("serialized quote opens with the mark", model.startsWith("> \u275D "), JSON.stringify(model));
		check("serialized quote keeps the blockquote shape", model.split("\n")[1] === "> 我已经编好启动器");

		// ---- a transcript the way DSH renders it ------------------------------
		const host = document.createElement("div");
		host.setAttribute("data-conversation-content", "");
		host.setAttribute("data-conversation-session", "s1");

		const bubble = (runText, tail) => {
			const box = document.createElement("div");
			box.className = "bubble";
			const run = document.createElement("span");
			run.className = "sent";
			run.textContent = runText;
			box.append(run);
			if (tail !== undefined) {
				const after = document.createElement("span");
				after.className = "sent";
				after.textContent = tail;
				box.append(after);
			}
			host.append(box);
			return { box, run };
		};

		// 1. the plain case: the message is the quote and a trailing comment.
		const plain = bubble(model + "\n\n" + "这是我的看法", "");
		// 2. text typed before the chip: the mark lands mid-line.
		const prefixed = bubble("看这里" + model + "\n\n" + "继续");
		// 3. a chip splits the message: the quote is its own run.
		const chipped = bubble(model + "\n\n", "正文在这一段");
		const chip = document.createElement("button");
		chip.setAttribute("data-ref-chip", "file");
		chip.textContent = "x";
		chipped.box.insertBefore(chip, chipped.box.lastChild);
		// 4. two chips in one message: one pill each, the wording kept in between.
		const double = bubble(
			"第一段" + "\n" + model + "\n\n" + "中间的话" + "\n" + testing.quoteBlock("第二处引用") + "\n\n" + "收尾"
		);
		// 5. a comment rides in the same pill: Kimi keeps quote + comment in one node.
		const commented = bubble("\n" + testing.quoteBlock("被引用的原话", "我的评论") + "\n\n" + "写在后面的话");
		document.body.append(host);

		await wait(200);

		const caps = () => Array.from(document.querySelectorAll(".dshq-cap"));
		check("every quote run got a capsule", caps().length === 6, caps().length + " capsule(s)");
		check("quote run is hidden, not removed", plain.run.isConnected && plain.run.style.display === "none", plain.run.style.display);
		check("the capsule quotes the original text", caps()[0] && caps()[0].querySelector(".dshq-cap-quote").textContent === "做法（推荐这条）\n我已经编好启动器");
		check("the user's own text survives next to it", plain.box.textContent.includes("这是我的看法"), plain.box.textContent);
		check("text before the chip is kept", prefixed.box.textContent.includes("看这里") && caps()[1].querySelector(".dshq-cap-quote").textContent === "做法（推荐这条）\n我已经编好启动器");
		check("a neighbouring chip is untouched", chipped.box.contains(chip) && caps()[2].querySelector(".dshq-cap-quote").textContent.startsWith("做法"));
		check("the pill is labelled and offers copy", caps()[0].getAttribute("aria-label") === "引用" && caps()[0].querySelector(".dshq-cap-copy") !== null);
		const commentCaps = commented.box.querySelectorAll(".dshq-cap");
		check("a comment does not become a second capsule", commentCaps.length === 1, commentCaps.length + " capsule(s)");
		check(
			"the pill carries the quote and the comment",
			commentCaps[0].querySelector(".dshq-cap-quote").textContent === "被引用的原话" &&
				commentCaps[0].querySelector(".dshq-cap-comment").textContent === "我的评论"
		);
		check("the wording typed after the chip stays outside the pill", commented.box.textContent.includes("写在后面的话"), commented.box.textContent);

		const doubleCaps = double.box.querySelectorAll(".dshq-cap");
		check("a message with two quotes gets two capsules", doubleCaps.length === 2, doubleCaps.length + " capsule(s)");
		check(
			"each capsule keeps its own quote",
			doubleCaps[0].querySelector(".dshq-cap-quote").textContent === "做法（推荐这条）\n我已经编好启动器" &&
				doubleCaps[1].querySelector(".dshq-cap-quote").textContent === "第二处引用"
		);
		check(
			"the wording between the quotes stays put",
			Array.from(double.box.querySelectorAll(".dshq-body")).map((node) => node.textContent).join(" | ") === "第一段 | 中间的话 | 收尾",
			Array.from(double.box.querySelectorAll(".dshq-body")).map((node) => node.textContent).join(" | ")
		);

		const styles = getComputedStyle(caps()[0]);
		check("capsule is a rounded pill", styles.borderRadius !== "0px" && styles.borderTopLeftRadius !== "0px", styles.borderTopLeftRadius);
		check("capsule has a fill of its own", styles.backgroundColor !== "rgba(0, 0, 0, 0)" && styles.backgroundColor !== "transparent", styles.backgroundColor);
		check("capsule has no border of its own", styles.borderTopWidth === "0px", styles.borderTopWidth);
		const quoteStyle = getComputedStyle(caps()[0].querySelector(".dshq-cap-quote"));
		check("the collapsed quote is one ellipsised line", quoteStyle.whiteSpace === "nowrap" && quoteStyle.textOverflow === "ellipsis", quoteStyle.whiteSpace + "/" + quoteStyle.textOverflow);

		// ---- the hover card: what one clipped line cannot show ----------------
		caps()[0].dispatchEvent(new MouseEvent("mouseenter"));
		const pop = document.getElementById("dsh-quote-popover");
		check("hovering a pill opens the hover card", pop !== null && pop.dataset.visible === "true", pop && pop.dataset.visible);
		check(
			"the hover card spells the quote out in full",
			pop.querySelector(".dshq-pop-quote").textContent === "做法（推荐这条）\n我已经编好启动器",
			pop.querySelector(".dshq-pop-quote").textContent
		);
		check("the hover card keeps the line count", pop.querySelector(".dshq-pop-meta").textContent.includes("2 行"), pop.querySelector(".dshq-pop-meta").textContent);
		check("the hover card is a fixed popover", getComputedStyle(pop).position === "fixed", getComputedStyle(pop).position);
		check("a quote without a comment gets one labelled half", pop.querySelectorAll(".dshq-pop-comment").length === 0);
		commentCaps[0].dispatchEvent(new MouseEvent("mouseenter"));
		check(
			"hovering a comment pill shows the comment too",
			pop.querySelector(".dshq-pop-comment") !== null && pop.querySelector(".dshq-pop-comment").textContent === "我的评论",
			pop.querySelector(".dshq-pop-comment") && pop.querySelector(".dshq-pop-comment").textContent
		);
		check(
			"the hover card labels both halves",
			Array.from(pop.querySelectorAll(".dshq-pop-label")).map((node) => node.textContent).join("/") === "引用/评论",
			Array.from(pop.querySelectorAll(".dshq-pop-label")).map((node) => node.textContent).join("/")
		);
		commentCaps[0].dispatchEvent(new MouseEvent("mouseleave"));
		await wait(250);
		check("leaving the pill closes the hover card", pop.dataset.visible === "false", pop.dataset.visible);

		// ---- the card dies with its anchor ------------------------------------
		// Sending the message removes the composer chip without any mouseleave.
		const composer = document.createElement("div");
		composer.setAttribute("data-composer-card", "");
		const chipNode = document.createElement("span");
		chipNode.className = "refChip";
		chipNode.textContent = testing.chipLabel("芯片里的原话", "芯片里的评论");
		composer.append(chipNode);
		document.body.append(composer);
		testing.rememberChip("芯片里的原话", "芯片里的评论", "s1");
		await wait(150);
		check("the composer chip is hooked for hover", chipNode.getAttribute("data-dshq-chip") === "1", chipNode.getAttribute("data-dshq-chip"));
		chipNode.dispatchEvent(new MouseEvent("mouseenter"));
		check(
			"hovering the composer chip opens the card",
			pop.dataset.visible === "true" && pop.querySelector(".dshq-pop-comment").textContent === "芯片里的评论",
			pop.dataset.visible + "/" + (pop.querySelector(".dshq-pop-comment") ?? {}).textContent
		);
		chipNode.remove();
		await wait(150);
		check("sending the message closes the card with the chip", pop.dataset.visible === "false", pop.dataset.visible);

		// ---- two chips, and a chip node reused for the next quote --------------
		const composer2 = document.createElement("div");
		composer2.setAttribute("data-composer-card", "");
		const chipA = document.createElement("span");
		chipA.className = "refChip";
		chipA.textContent = testing.chipLabel("第一处引用", "第一处评论");
		const chipB = document.createElement("span");
		chipB.className = "refChip";
		chipB.textContent = testing.chipLabel("第二处引用", "第二处评论");
		composer2.append(chipA, chipB);
		document.body.append(composer2);
		testing.rememberChip("第一处引用", "第一处评论", "s1");
		testing.rememberChip("第二处引用", "第二处评论", "s1");
		await wait(200);
		chipB.dispatchEvent(new MouseEvent("mouseenter"));
		check(
			"the second chip shows its own quote, not the first one's",
			pop.querySelector(".dshq-pop-quote").textContent === "第二处引用" && pop.querySelector(".dshq-pop-comment").textContent === "第二处评论",
			pop.querySelector(".dshq-pop-quote").textContent
		);
		chipA.dispatchEvent(new MouseEvent("mouseenter"));
		check("the first chip still shows its own quote", pop.querySelector(".dshq-pop-quote").textContent === "第一处引用", pop.querySelector(".dshq-pop-quote").textContent);

		chipA.textContent = testing.chipLabel("换成另一处引用", "换成另一条评论");
		testing.rememberChip("换成另一处引用", "换成另一条评论", "s1");
		await wait(200);
		chipA.dispatchEvent(new MouseEvent("mouseenter"));
		check(
			"a chip node reused for another quote shows what it holds now",
			pop.querySelector(".dshq-pop-quote").textContent === "换成另一处引用" && pop.querySelector(".dshq-pop-comment").textContent === "换成另一条评论",
			pop.querySelector(".dshq-pop-quote").textContent
		);

		// ---- the selection menu sits under the selection ----------------------
		const paragraph = document.createElement("p");
		paragraph.style.margin = "24px 0";
		paragraph.textContent = "菜单应该出现在这段话的下方，而不是压在上面。";
		host.append(paragraph);
		await wait(60);
		const range = document.createRange();
		range.selectNodeContents(paragraph);
		const selection = window.getSelection();
		selection.removeAllRanges();
		selection.addRange(range);
		document.dispatchEvent(new Event("selectionchange"));
		await wait(200);
		const bar = document.getElementById("dsh-quote-bar");
		const box = bar === null ? null : bar.getBoundingClientRect();
		const under = paragraph.getBoundingClientRect();
		check("selecting text opens the menu", bar !== null && bar.dataset.visible === "true", bar === null ? "no bar" : bar.dataset.visible);
		check(
			"the menu opens under the selection",
			box !== null && box.top >= under.bottom - 1 && box.top <= under.bottom + 40,
			box === null ? "no box" : "bar.top " + Math.round(box.top) + " / text.bottom " + Math.round(under.bottom)
		);
		check("the menu is not above the selection any more", box !== null && box.top > under.top, box === null ? "no box" : "bar.top " + Math.round(box.top) + " / text.top " + Math.round(under.top));

		// ---- idempotence, re-render and removal -------------------------------
		caps()[0].click();
		check("clicking the pill expands it", caps()[0].dataset.expanded === "true", caps()[0].dataset.expanded);

		plain.run.firstChild.nodeValue = model + "\n\n" + "改过的正文";
		await wait(120);
		check("a re-render refreshes the capsule in place", caps().length === 6 && plain.box.textContent.includes("改过的正文"), caps().length + " capsule(s)");
		check("the earlier capsule was replaced, not duplicated", plain.box.querySelectorAll(".dshq-cap").length === 1);

		const doomed = caps()[2];
		chipped.run.remove();
		await wait(120);
		check("removing the message removes its capsule", !doomed.isConnected && document.querySelectorAll(".dshq-cap").length === 5, document.querySelectorAll(".dshq-cap").length + " left");

		// ---- the codec DSH's send path calls ---------------------------------
		check("one reference source is registered", sources.length === 1, sources.length + " source(s)");
		const serialized = await sources[0].codec.serialize(model + "\n\n");
		check("codec.serialize is what lands in the sent message", serialized === model + "\n\n", JSON.stringify(serialized));
		check("the model form round-trips back into the pill", testing.splitQuoteRuns(serialized)[0].quote === "做法（推荐这条）\n我已经编好启动器");

		// ---- report -----------------------------------------------------------
		const failed = checks.filter((entry) => !entry.ok);
		out.dataset.status = failed.length === 0 ? "pass" : "fail";
		out.textContent =
			(failed.length === 0 ? "PASS " : "FAIL ") + (checks.length - failed.length) + "/" + checks.length + " checks\n" +
			checks.map((entry) => (entry.ok ? "ok   " : "FAIL ") + entry.name + (entry.detail === "" ? "" : "  [" + entry.detail + "]")).join("\n");

		// Beacon: when the page is served by a collector (the work dir's
		// capsule-server.mjs), POST the report so a headless run is scriptable.
		try {
			await fetch("/report", {
				method: "POST",
				headers: { "content-type": "text/plain" },
				body: out.dataset.status + "\n" + out.textContent +
					(window.__probeErrors.length === 0 ? "" : "\nerrors: " + window.__probeErrors.join(" | ")),
			});
		} catch (error) {
			// file:// or no collector — the report stays in #probe-out
		}
	})();
</script>
</body>
</html>
